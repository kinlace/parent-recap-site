<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Parent Recap</title>
    <meta
      name="description"
      content="One short email every evening about your kids' school and clubs, from school mail, Wilma, eVaka, WhatsApp parent groups, MyClub and Eepos, written on your own Mac or Windows PC, or run for you if you have no computer."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23C8731A'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #f4eee3;
        --panel: #ffffff;
        --panel-2: #faf6ef;
        --ink: #2b2622;
        --ink-2: #4a423a;
        --muted: #7a6e62;
        --line: #e4dacb;
        --accent: #c8731a;
        --accent-soft: #fbead5;
        --bad: #b8392b;
        --bad-soft: #f8e1dd;
        --good: #2c7a57;
        --chip: #eadfcc;
        --chip-on: #2b2622;
        --chip-on-ink: #ffffff;
        --bezel: #0d0f12;
        --shadow:
          0 1px 0 rgba(18, 22, 27, 0.04),
          0 12px 32px -18px rgba(18, 22, 27, 0.35);
        --display:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        --body:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sys:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          Helvetica, Arial, sans-serif;
        --pw: clamp(250px, 23vw, 300px);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1014;
          --panel: #161a20;
          --panel-2: #1c2128;
          --ink: #e8ebef;
          --ink-2: #c3c9d1;
          --muted: #8b94a0;
          --line: #2a3139;
          --accent: #efa24a;
          --accent-soft: #3a2913;
          --bad: #e2705f;
          --bad-soft: #3a1e1a;
          --good: #5dbb8e;
          --chip: #232930;
          --chip-on: #e8ebef;
          --chip-on-ink: #0d1014;
          --bezel: #000000;
          --shadow:
            0 1px 0 rgba(0, 0, 0, 0.3), 0 16px 36px -20px rgba(0, 0, 0, 0.8);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1014;
        --panel: #161a20;
        --panel-2: #1c2128;
        --ink: #e8ebef;
        --ink-2: #c3c9d1;
        --muted: #8b94a0;
        --line: #2a3139;
        --accent: #efa24a;
        --accent-soft: #3a2913;
        --bad: #e2705f;
        --bad-soft: #3a1e1a;
        --good: #5dbb8e;
        --chip: #232930;
        --chip-on: #e8ebef;
        --chip-on-ink: #0d1014;
        --bezel: #000000;
        --shadow:
          0 1px 0 rgba(0, 0, 0, 0.3), 0 16px 36px -20px rgba(0, 0, 0, 0.8);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      /* phone */
      .phone {
        width: var(--pw);
        aspect-ratio: 300/620;
        background: var(--bezel);
        border-radius: 46px;
        padding: 11px;
        box-shadow:
          0 30px 60px -30px rgba(10, 14, 20, 0.55),
          inset 0 0 0 2px #2a2e34;
      }
      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 36px;
        overflow: hidden;
        background: #fff;
        font-family: var(--sys);
        color: #111;
        container-type: inline-size;
      }
      .island {
        position: absolute;
        top: 9px;
        left: 50%;
        transform: translateX(-50%);
        width: 30%;
        height: 22px;
        background: #000;
        border-radius: 14px;
        z-index: 9;
      }
      .view {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      .view.enter {
        animation: enter 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .sb {
        height: 40px;
        flex: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 22px 0 26px;
        font-size: 12px;
        font-weight: 600;
      }
      .sb .ic2 {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .bars {
        display: flex;
        gap: 1.5px;
        align-items: flex-end;
        height: 9px;
      }
      .bars i {
        width: 2.5px;
        background: currentColor;
        border-radius: 1px;
      }
      .batt {
        width: 19px;
        height: 9px;
        border: 1.3px solid currentColor;
        border-radius: 3px;
        position: relative;
        opacity: 0.9;
      }
      .batt::after {
        content: "";
        position: absolute;
        inset: 1.2px;
        right: 5px;
        background: currentColor;
        border-radius: 1px;
      }

      /* mail */
      .mail {
        background: #fff;
      }
      .mail .sb {
        color: #111;
      }
      .mnav {
        flex: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 2px 14px 6px;
        color: #2f7bf0;
        font-size: 14px;
      }
      .mscroll {
        position: absolute;
        top: 66px;
        left: 0;
        right: 0;
        bottom: 0;
        overflow-y: auto;
        scrollbar-width: none;
        padding: 0 14px 24px;
      }
      .mscroll::-webkit-scrollbar {
        display: none;
      }
      .mhead {
        display: grid;
        grid-template-columns: 30px 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 6px 0 8px;
        border-bottom: 1px solid #eceef1;
      }
      .av {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #c8cdd4;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
      }
      .mfrom {
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.2;
        word-break: break-all;
      }
      .mto {
        font-size: 11px;
        color: #77808b;
      }
      .mtime {
        font-size: 11px;
        color: #77808b;
      }
      .msubj {
        font-size: 15px;
        font-weight: 700;
        margin: 9px 0 2px;
        line-height: 1.25;
      }
      .mb {
        font-family: -apple-system, Helvetica, Arial, sans-serif;
        font-size: 12.3px;
        line-height: 1.42;
        color: #111;
      }
      .mb .h2 {
        font-size: 15.5px;
        font-weight: 700;
        margin: 10px 0 8px;
        line-height: 1.25;
      }
      .mb p {
        margin: 0 0 9px;
      }
      .mb h3 {
        font-size: 13.5px;
        margin: 13px 0 5px;
      }
      .mb h4 {
        font-size: 12.8px;
        margin: 10px 0 4px;
      }
      .mb ul {
        margin: 0 0 8px;
        padding-left: 17px;
      }
      .mb li {
        margin-bottom: 5px;
      }
      .mb small {
        font-size: 11px;
        color: #666;
      }
      .mb .fb {
        color: #888;
        font-size: 10.5px;
        white-space: nowrap;
      }
      .mb .warn {
        color: #a33;
      }
      .mb .hint {
        color: #666;
      }
      .mb .cov,
      .mb .ftr {
        color: #888;
        font-size: 10.5px;
        margin-bottom: 5px;
      }
      .mb a {
        color: #1a5fd0;
      }
      .mb .hl {
        background: #fdebd2;
        border-radius: 4px;
        box-shadow: 0 0 0 3px #fdebd2;
      }
      .att {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 9px;
        align-items: center;
        border: 1px solid #e3e6ea;
        border-radius: 12px;
        padding: 8px 10px;
        margin: 12px 0 6px;
        background: #f8f9fb;
      }
      .att.hl {
        animation: ring 1.2s ease-in-out infinite;
      }
      .att .cal {
        width: 34px;
        height: 38px;
        border-radius: 7px;
        background: #fff;
        border: 1px solid #e0e3e8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 8px;
        color: #e5483b;
        font-weight: 700;
        line-height: 1;
      }
      .att .cal b {
        font-size: 16px;
        color: #111;
        margin-top: 2px;
      }
      .att .fn {
        font-size: 11.5px;
        font-weight: 600;
        word-break: break-all;
        line-height: 1.25;
      }
      .att .fs {
        font-size: 10.5px;
        color: #77808b;
      }

      :root {
        --pw: min(300px, 78vw);
      }
      body {
        font-family:
          var(--body), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }
      .mono {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .page {
        max-width: 1080px;
        margin: 0 auto;
        padding: 20px 20px 44px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px 20px;
        flex-wrap: wrap;
        margin-bottom: 34px;
      }
      .brand {
        font-family: var(--display);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
      }
      .segs {
        display: inline-flex;
        background: var(--chip);
        border-radius: 999px;
        padding: 3px;
      }
      .seg {
        border: 0;
        background: none;
        border-radius: 999px;
        padding: 6px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        color: var(--ink-2);
        min-height: 36px;
      }
      .seg[aria-pressed="true"] {
        background: var(--chip-on);
        color: var(--chip-on-ink);
      }
      .seg:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 44px;
        align-items: center;
      }
      .hero h1 {
        font-family:
          var(--display), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        font-weight: 700;
        font-size: clamp(32px, 5vw, 56px);
        line-height: 1.08;
        letter-spacing: -0.02em;
        margin: 8px 0 14px;
        text-wrap: balance;
      }
      .lede {
        font-size: 17px;
        color: var(--ink-2);
        max-width: 56ch;
        margin: 0 0 18px;
      }
      .watch {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 22px;
        padding: 9px 16px 9px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        min-height: 44px;
        box-sizing: border-box;
      }
      .watch i {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-style: normal;
        font-size: 11px;
        padding-left: 2px;
        box-sizing: border-box;
      }
      .watch:hover {
        border-color: var(--ink-2);
      }
      .watch:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 24px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 999px;
        padding: 5px 13px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink);
        text-decoration: none;
      }
      .badge::before {
        content: "✓";
        color: var(--good);
        font-weight: 700;
      }
      a.badge:hover {
        border-color: var(--ink-2);
      }
      a.badge:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .phone-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .cap {
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        max-width: 300px;
      }
      .cards {
        margin-top: 48px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 16px 18px;
      }
      .card:last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }
      .card h2 {
        font-family:
          var(--display), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        font-size: 18px;
        margin: 6px 0 8px;
        letter-spacing: -0.01em;
      }
      .card ul {
        margin: 0;
        padding-left: 18px;
        color: var(--ink-2);
        font-size: 14.5px;
      }
      .card li {
        margin-bottom: 6px;
      }
      .card p {
        margin: 0;
        color: var(--ink-2);
        font-size: 14.5px;
      }
      .lang {
        display: flex;
        align-items: center;
        gap: 10px 14px;
        flex-wrap: wrap;
      }
      .more {
        font-size: 13px;
        color: var(--muted);
      }
      .cta {
        margin-top: 16px;
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: 22px 36px;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 22px 24px;
      }
      .cta h2 {
        font-family:
          var(--display), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        font-size: 24px;
        margin: 6px 0 12px;
        letter-spacing: -0.015em;
      }
      .steps {
        margin: 0;
        padding-left: 22px;
        color: var(--ink-2);
        font-size: 15px;
        display: grid;
        gap: 8px;
      }
      .steps li::marker {
        font-family: var(--mono);
        color: var(--accent);
        font-weight: 500;
      }
      .links {
        display: grid;
        gap: 12px;
      }
      button.cta-btn {
        font: inherit;
        text-align: left;
        cursor: pointer;
        width: 100%;
      }
      .start {
        grid-column: 1/-1;
        border-top: 1px solid var(--line);
        padding-top: 18px;
        display: grid;
        gap: 14px;
        min-width: 0;
      }
      .os {
        display: inline-flex;
        justify-self: start;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px;
        gap: 2px;
      }
      .os button {
        border: 0;
        background: none;
        padding: 5px 14px;
        border-radius: 999px;
        cursor: pointer;
        color: var(--ink-2);
        font-size: 14px;
      }
      .os button[aria-pressed="true"] {
        background: var(--chip-on);
        color: var(--chip-on-ink);
      }
      .start ol {
        margin: 0;
        padding-left: 22px;
        display: grid;
        gap: 10px;
        color: var(--ink-2);
        font-size: 15px;
        min-width: 0;
      }
      .start ol li {
        min-width: 0;
      }
      .start ol li::marker {
        font-family: var(--mono);
        color: var(--accent);
        font-weight: 500;
      }
      .cmd {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        min-width: 0;
      }
      .cmd code {
        flex: 1;
        min-width: 0;
        white-space: pre-wrap;
        word-break: break-all;
        font-family: var(--mono);
        font-size: 13.5px;
        line-height: 1.5;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        color: var(--ink);
      }
      .cmd button {
        flex: none;
        border: 1px solid var(--chip-on);
        background: var(--chip-on);
        color: var(--chip-on-ink);
        border-radius: 10px;
        padding: 0 16px;
        cursor: pointer;
        font-size: 14px;
        min-height: 44px;
      }
      .cmd button:focus-visible,
      .os button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .start .note {
        margin: 0;
        font-size: 13.5px;
        color: var(--muted);
      }
      .cta-btn {
        display: grid;
        gap: 3px;
        text-decoration: none;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px 16px;
        background: var(--panel-2);
        min-height: 44px;
      }
      .cta-btn b {
        font-size: 16px;
      }
      .cta-btn span {
        font-size: 13.5px;
        color: var(--ink-2);
      }
      .cta-btn.primary {
        background: var(--chip-on);
        border-color: var(--chip-on);
        color: var(--chip-on-ink);
      }
      .cta-btn.primary span {
        color: var(--chip-on-ink);
        opacity: 0.82;
      }
      .cta-btn:hover {
        border-color: var(--ink-2);
      }
      .cta-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .hero-go {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 12px;
        align-items: center;
        margin-bottom: 16px;
      }
      .go {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        text-decoration: none;
      }
      .go:hover {
        filter: brightness(1.06);
      }
      .go:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .sect {
        margin-top: 56px;
      }
      .sect > h2 {
        font-family:
          var(--display), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        font-size: 22px;
        margin: 0 0 14px;
        letter-spacing: -0.015em;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .src,
      .stepc {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px 16px;
        box-shadow: var(--shadow);
      }
      .src b,
      .stepc b {
        display: block;
        font-size: 16px;
      }
      .src span,
      .stepc span {
        display: block;
        color: var(--ink-2);
        font-size: 14px;
        margin-top: 2px;
      }
      .stepc i {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent);
        font: 700 15px var(--mono);
        margin-bottom: 10px;
      }
      .fine {
        margin: 28px 0 0;
        font-size: 12.5px;
        color: var(--muted);
      }
      .demo {
        margin-top: 48px;
      }
      .demo h2 {
        font-family:
          var(--display), "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        font-size: 22px;
        margin: 0 0 14px;
        letter-spacing: -0.015em;
      }
      .demo video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      .foot {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        margin-top: 10px;
        font-size: 13px;
      }
      .foot a {
        color: var(--ink-2);
      }
      @media (max-width: 860px) {
        .hero {
          grid-template-columns: minmax(0, 1fr);
          gap: 30px;
        }
        .cards,
        .cta {
          grid-template-columns: minmax(0, 1fr);
        }

        const REPO = "https://github.com/kinlace/parent-recap";

          clearInterval(scrollTimer);
          if (reduced) return;

            const sc = scr.querySelector(".mscroll");

              top: stopAt === 0 || !el ? 0 : Math.max(0, el.offsetTop - 10),
              behavior: "smooth",
            });
          }, 3400);
        }
        ["wheel", "touchstart", "pointerdown"].forEach((ev) =>
          scr.addEventListener(ev, () => clearInterval(scrollTimer), {
            passive: true,

                      "</button></div>"

                  "</li>",
              )

            "</ol>" +
            (onPhone ? '<p class="note">' + st.phone + "</p>" : "") +
            "</div>";
          document.getElementById("t-fine").textContent = t.fine;
          const LINKS = [
            REPO,
            REPO + "/blob/main/LICENSE",
            README[lang][0] + "#" + README[lang][2],
            REPO + "/issues",
          ];
          document.getElementById("t-links").innerHTML = t.links
            .map((x, i) => '<a href="' + LINKS[i] + '">' + x + "</a>")
            .join("");
          document
            .querySelectorAll(".seg")
            .forEach((b) =>
              b.setAttribute("aria-pressed", String(b.dataset.l === lang)),
            );
          scr.innerHTML =
            '<div class="island"></div>' +
            mailView(lang, "tue", "21:03", "Mei");
          auto();
        }
        function setLang(l, remember) {
          lang = l;
          if (remember) {
            try {
              localStorage.setItem("pr-lang", l);
            } catch (e) {}
            try {
              const u = new URL(location.href);
              u.searchParams.set("lang", l);
              history.replaceState(null, "", u);
            } catch (e) {}
          }
          render();
        }
        document
          .querySelectorAll(".seg")
          .forEach((b) =>
            b.addEventListener("click", () => setLang(b.dataset.l, true)),
          );
        document.getElementById("t-cta").addEventListener("click", (e) => {
          if (e.target.closest("[data-start]")) {
            startOpen = !startOpen;
            render();
            if (startOpen)
              document.getElementById("t-start").scrollIntoView({
                behavior: reduced ? "auto" : "smooth",
                block: "nearest",
              });
            return;
          }
          const o = e.target.closest("[data-os]");
          if (o) {
            os = o.dataset.os;
            render();
            return;
          }
          const c = e.target.closest("[data-copy]");
          if (!c) return;
          const done = () => {
            c.textContent = START[lang].copied;
            setTimeout(() => {
              c.textContent = START[lang].copy;
            }, 1800);
          };
          const select = () => {
            const r = document.createRange();
            r.selectNodeContents(document.getElementById("t-line"));
            const sel = getSelection();
            sel.removeAllRanges();
            sel.addRange(r);
          };
          try {
            navigator.clipboard.writeText(LINE[os]).then(done, select);
          } catch (err) {
            select();
          }
        });

          let l = "";
          // ?lang=fi, or #fi as in the links shared before the page moved here
          try {
            const q = new URLSearchParams(location.search).get("lang");

            else if (Object.hasOwn(T, h)) l = h;
          } catch (e) {}
          if (!l) {
            try {
              const s = localStorage.getItem("pr-lang");
              if (T[s]) l = s;
            } catch (e) {}
          }
          if (!l) {
            const n = (navigator.language || "en").slice(0, 2);
            l = T[n] ? n : "en";
          }
          setLang(l, false);
        })();
      })();
